<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Note - NoteNest</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #ffffff, #fff4f8);
            display: flex;
            justify-content: center;
            padding: 20px;
            color: #222;
        }

        .container {
            width: 52%;
            min-width: 350px;
            max-width: 650px;
            min-height: calc(100vh - 40px);

            background: #ffffff;
            border-radius: 30px;
            padding: 25px 22px 40px;

            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
        }

        /* Header */
        .top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .back-btn {
            width: 44px;
            height: 44px;

            border: none;
            border-radius: 50%;

            background: #fff0f5;
            color: #ff6fa5;

            font-size: 17px;
            cursor: pointer;

            transition: 0.25s;
        }

        .back-btn:hover {
            background: #ffe3ed;
            transform: translateX(-2px);
        }

        h1 {
            font-size: 21px;
            font-weight: 700;
            color: #222;
        }

        /* Form */
        .form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-size: 12px;
            font-weight: 600;
            color: #444;
        }

        /* Inputs */
        input,
        textarea,
        select {
            width: 100%;

            border: 1px solid #ffe1eb;
            border-radius: 16px;

            background: #fff7fa;
            color: #333;

            padding: 14px 16px;

            font-family: "Poppins", sans-serif;
            font-size: 13px;

            outline: none;

            transition: 0.25s;
        }

        input::placeholder,
        textarea::placeholder {
            color: #aaa;
        }

        input:focus,
        textarea:focus,
        select:focus {
            background: #ffffff;
            border-color: #ff6fa5;
            box-shadow: 0 0 0 3px rgba(255, 111, 165, 0.08);
        }

        /* Title */
        input {
            height: 50px;
        }

        /* Content */
        textarea {
            min-height: 220px;
            resize: vertical;
            line-height: 1.6;
        }

        /* Category */
        select {
            height: 50px;
            cursor: pointer;
        }

        /* Create / Update Button */
        .create-btn {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 16px;

            background: linear-gradient(
                135deg,
                #ff6fa5,
                #ff8fb9
            );

            color: #ffffff;

            font-family: "Poppins", sans-serif;
            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            box-shadow: 0 8px 20px rgba(255, 111, 165, 0.22);

            transition: 0.25s;
        }

        .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 111, 165, 0.30);
        }

        .create-btn:active {
            transform: translateY(0);
        }

        .create-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Message */
        #message {
            min-height: 18px;
            margin-top: 12px;

            text-align: center;
            font-size: 11px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            body {
                padding: 0;
                background: #ffffff;
            }

            .container {
                width: 100%;
                min-width: 0;
                max-width: 100%;
                min-height: 100vh;

                border-radius: 0;
                box-shadow: none;

                padding: 22px 18px 40px;
            }

            .top {
                margin-bottom: 22px;
            }

            .back-btn {
                width: 42px;
                height: 42px;
            }

            h1 {
                font-size: 20px;
            }

            textarea {
                min-height: 200px;
            }
        }

        /* Small Mobile */
        @media (max-width: 380px) {

            .container {
                padding: 20px 15px 35px;
            }

            h1 {
                font-size: 19px;
            }

            input,
            textarea,
            select {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="top">

            <button
                class="back-btn"
                id="backBtn"
                type="button"
            >
                <i class="fa-solid fa-arrow-left"></i>
            </button>

            <h1 id="pageTitle">Create Note</h1>

        </div>


        <!-- Note Form -->
        <div class="form">

            <!-- Title -->
            <div class="form-group">

                <label for="title">
                    Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter note title"
                >

            </div>


            <!-- Content -->
            <div class="form-group">

                <label for="content">
                    Content
                </label>

                <textarea
                    id="content"
                    placeholder="Write your note here..."
                ></textarea>

            </div>


            <!-- Category -->
            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select id="category">

                    <option value="Study">
                        📚 Study
                    </option>

                    <option value="Ideas">
                        💡 Ideas
                    </option>

                    <option value="Personal">
                        ❤️ Personal
                    </option>

                </select>

            </div>


            <!-- Create / Update Button -->
            <button
                class="create-btn"
                id="createBtn"
                type="button"
            >
                <i class="fa-solid fa-plus"></i>
                <span id="buttonText">Create Note</span>
            </button>


            <!-- Message -->
            <p id="message"></p>

        </div>

    </div>


    <script>

        // =========================
        // AUTHENTICATION
        // =========================

        const token = localStorage.getItem("token");

        if (!token) {

            alert("Please login first.");

            window.location.href = "login.html";
        }


        // =========================
        // URL / EDIT MODE
        // =========================

        const urlParams = new URLSearchParams(window.location.search);

        const noteId = urlParams.get("id");

        const isEditMode = urlParams.get("edit") === "true";


        // =========================
        // ELEMENTS
        // =========================

        const titleInput = document.getElementById("title");

        const contentInput = document.getElementById("content");

        const categoryInput = document.getElementById("category");

        const createBtn = document.getElementById("createBtn");

        const pageTitle = document.getElementById("pageTitle");

        const buttonText = document.getElementById("buttonText");

        const message = document.getElementById("message");

        const backBtn = document.getElementById("backBtn");


        // =========================
        // CHANGE UI FOR EDIT MODE
        // =========================

        if (isEditMode) {

            pageTitle.textContent = "Edit Note";

            buttonText.textContent = "Update Note";

            createBtn.innerHTML =
                '<i class="fa-solid fa-pen"></i> <span id="buttonText">Update Note</span>';

        }


        // =========================
        // BACK BUTTON
        // =========================

        backBtn.addEventListener("click", function () {

            window.location.href = "dashboard.html";

        });


        // =========================
        // LOAD EXISTING NOTE
        // =========================

        async function loadNoteForEdit() {

            if (!isEditMode || !noteId) {
                return;
            }

            try {

                message.textContent = "Loading note...";
                message.style.color = "#ff6fa5";

                const response = await fetch(
                    `http://localhost:5000/api/notes/${encodeURIComponent(noteId)}`,
                    {
                        method: "GET",

                        headers: {
                            "Authorization": `Bearer ${token}`
                        }
                    }
                );


                const data = await response.json();


                // Session expired
                if (response.status === 401) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("user");

                    alert("Session expired. Please login again.");

                    window.location.href = "login.html";

                    return;
                }


                if (!response.ok) {

                    throw new Error(
                        data.message || "Failed to load note."
                    );

                }


                // =========================
                // GET NOTE DATA
                // =========================

                const note = data.note || data;


                titleInput.value = note.title || "";

                contentInput.value = note.content || "";

                if (note.category) {

                    categoryInput.value = note.category;

                }


                message.textContent = "";


            } catch (error) {

                console.error("Load Note Error:", error);

                message.textContent =
                    error.message || "Failed to load note.";

                message.style.color = "#e85b75";

            }

        }


        // =========================
        // CREATE / UPDATE NOTE
        // =========================

        createBtn.addEventListener("click", async function () {

            const title = titleInput.value.trim();

            const content = contentInput.value.trim();

            const category = categoryInput.value;


            // =========================
            // VALIDATE TITLE
            // =========================

            if (!title) {

                message.textContent =
                    "Please enter a title.";

                message.style.color = "#e85b75";

                titleInput.focus();

                return;
            }


            // =========================
            // VALIDATE CONTENT
            // =========================

            if (!content) {

                message.textContent =
                    "Please enter note content.";

                message.style.color = "#e85b75";

                contentInput.focus();

                return;
            }


            // =========================
            // DISABLE BUTTON
            // =========================

            createBtn.disabled = true;


            if (isEditMode) {

                createBtn.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';

            } else {

                createBtn.innerHTML =
                    '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';

            }


            message.textContent = "";


            try {

                // =========================
                // URL + METHOD
                // =========================

                let url = "http://localhost:5000/api/notes";

                let method = "POST";


                if (isEditMode) {

                    if (!noteId) {

                        throw new Error(
                            "Note ID not found."
                        );

                    }

                    url =
                        `http://localhost:5000/api/notes/${encodeURIComponent(noteId)}`;

                    method = "PUT";

                }


                // =========================
                // REQUEST
                // =========================

                const response = await fetch(
                    url,
                    {
                        method: method,

                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },

                        body: JSON.stringify({
                            title: title,
                            content: content,
                            category: category
                        })
                    }
                );


                const data = await response.json();


                // =========================
                // SESSION EXPIRED
                // =========================

                if (response.status === 401) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("user");

                    alert(
                        "Session expired. Please login again."
                    );

                    window.location.href = "login.html";

                    return;
                }


                // =========================
                // OTHER ERRORS
                // =========================

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        (
                            isEditMode
                                ? "Failed to update note."
                                : "Failed to create note."
                        )
                    );

                }


                // =========================
                // SUCCESS
                // =========================

                if (isEditMode) {

                    message.textContent =
                        "Note updated successfully!";

                } else {

                    message.textContent =
                        "Note created successfully!";

                }

                message.style.color = "#ff6fa5";


                // =========================
                // GO TO DASHBOARD
                // =========================

                setTimeout(function () {

                    window.location.href =
                        "dashboard.html";

                }, 1000);


            } catch (error) {

                console.error(
                    isEditMode
                        ? "Update Note Error:"
                        : "Create Note Error:",
                    error
                );


                message.textContent =
                    error.message ||
                    (
                        isEditMode
                            ? "Failed to update note."
                            : "Failed to create note."
                    );

                message.style.color = "#e85b75";


                // =========================
                // ENABLE BUTTON AGAIN
                // =========================

                createBtn.disabled = false;


                if (isEditMode) {

                    createBtn.innerHTML =
                        '<i class="fa-solid fa-pen"></i> <span>Update Note</span>';

                } else {

                    createBtn.innerHTML =
                        '<i class="fa-solid fa-plus"></i> <span>Create Note</span>';

                }

            }

        });


        // =========================
        // INITIALIZE
        // =========================

        loadNoteForEdit();

    </script>

</body>

</html>
