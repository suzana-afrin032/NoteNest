<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Note - NoteNest</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #f8f9ff;
            min-height: 100vh;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 30px 20px;
        }

        .top {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .back-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            font-size: 18px;
        }

        .back-btn:hover {
            background: #eeeeff;
        }

        h1 {
            font-size: 28px;
        }

        .form {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 14px;
            font-family: inherit;
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
            background: white;
        }

        textarea {
            min-height: 220px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #7c5cff;
        }

        .update-btn {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            background: #7c5cff;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .update-btn:hover {
            opacity: 0.9;
        }

        .update-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

    </style>

</head>


<body>

    <div class="container">

        <!-- =========================
             HEADER
        ========================== -->

        <div class="top">

            <button
                class="back-btn"
                id="backBtn"
                type="button">

                <i class="fa-solid fa-arrow-left"></i>

            </button>

            <h1>Edit Note</h1>

        </div>


        <!-- =========================
             FORM
        ========================== -->

        <div class="form">

            <!-- TITLE -->

            <label for="title">
                Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter note title">


            <!-- CONTENT -->

            <label for="content">
                Content
            </label>

            <textarea
                id="content"
                placeholder="Write your note here..."></textarea>


            <!-- CATEGORY -->

            <label for="category">
                Category
            </label>

            <select id="category">

                <option value="Study">
                    📚 Study
                </option>

                <option value="Ideas">
                    💡 Ideas
                </option>

                <option value="Personal">
                    ❤️ Personal
                </option>

            </select>


            <!-- UPDATE BUTTON -->

            <button
                class="update-btn"
                id="updateBtn"
                type="button">

                <i class="fa-solid fa-pen"></i>
                Update Note

            </button>


            <p id="message"></p>

        </div>

    </div>


    <script>

        // =========================
        // GET JWT TOKEN
        // =========================

        const token =
            localStorage.getItem("token");


        // =========================
        // CHECK LOGIN
        // =========================

        if (!token) {

            alert("Please login first.");

            window.location.href =
                "login.html";

        }


        // =========================
        // GET NOTE ID FROM URL
        // =========================

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const noteId =
            urlParams.get("id");


        // =========================
        // GET ELEMENTS
        // =========================

        const titleInput =
            document.getElementById("title");

        const contentInput =
            document.getElementById("content");

        const categoryInput =
            document.getElementById("category");

        const updateBtn =
            document.getElementById("updateBtn");

        const message =
            document.getElementById("message");


        // =========================
        // CHECK NOTE ID
        // =========================

        if (!noteId) {

            message.textContent =
                "Note ID not found ❌";

            updateBtn.disabled = true;

        }


        // =========================
        // LOAD NOTE
        // =========================

        async function loadNote() {

            try {

                const response =
                    await fetch(
                        `http://localhost:5000/api/notes/${noteId}`,
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );


                const note =
                    await response.json();


                console.log(
                    "Note from MongoDB:",
                    note
                );


                // =========================
                // TOKEN ERROR
                // =========================

                if (response.status === 401) {

                    localStorage.removeItem("token");
                    localStorage.removeItem("user");

                    alert(
                        "Session expired. Please login again."
                    );

                    window.location.href =
                        "login.html";

                    return;

                }


                // =========================
                // OTHER ERROR
                // =========================

                if (!response.ok) {

                    throw new Error(
                        note.message ||
                        "Failed to load note"
                    );

                }


                // =========================
                // FILL FORM
                // =========================

                titleInput.value =
                    note.title || "";

                contentInput.value =
                    note.content || "";

                categoryInput.value =
                    note.category || "Study";


            } catch (error) {

                console.error(
                    "Error loading note:",
                    error
                );

                message.textContent =
                    error.message ||
                    "Failed to load note ❌";

                message.style.color =
                    "red";

            }

        }


        // =========================
        // UPDATE NOTE
        // =========================

        updateBtn.addEventListener(
            "click",
            async function () {

                const title =
                    titleInput.value.trim();

                const content =
                    contentInput.value.trim();

                const category =
                    categoryInput.value;


                // =========================
                // VALIDATION
                // =========================

                if (!title || !content) {

                    message.textContent =
                        "Please enter title and content.";

                    message.style.color =
                        "red";

                    return;

                }


                try {

                    // =========================
                    // DISABLE BUTTON
                    // =========================

                    updateBtn.disabled =
                        true;

                    updateBtn.innerHTML =
                        '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';


                    // =========================
                    // PUT REQUEST
                    // =========================

                    const response =
                        await fetch(
                            `http://localhost:5000/api/notes/${noteId}`,
                            {
                                method: "PUT",

                                headers: {

                                    "Content-Type":
                                        "application/json",

                                    "Authorization":
                                        `Bearer ${token}`

                                },

                                body: JSON.stringify({

                                    title: title,

                                    content: content,

                                    category: category

                                })

                            }
                        );


                    // =========================
                    // RESPONSE
                    // =========================

                    const data =
                        await response.json();


                    console.log(
                        "Update response:",
                        data
                    );


                    // =========================
                    // TOKEN ERROR
                    // =========================

                    if (response.status === 401) {

                        localStorage.removeItem(
                            "token"
                        );

                        localStorage.removeItem(
                            "user"
                        );

                        alert(
                            "Session expired. Please login again."
                        );

                        window.location.href =
                            "login.html";

                        return;

                    }


                    // =========================
                    // OTHER ERROR
                    // =========================

                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Failed to update note"
                        );

                    }


                    // =========================
                    // SUCCESS
                    // =========================

                    message.textContent =
                        "Note updated successfully! ✅";

                    message.style.color =
                        "green";


                    // =========================
                    // GO TO DASHBOARD
                    // =========================

                    setTimeout(
                        function () {

                            window.location.href =
                                "dashboard.html";

                        },
                        1000
                    );


                } catch (error) {

                    console.error(
                        "Update error:",
                        error
                    );

                    message.textContent =
                        error.message ||
                        "Failed to update note ❌";

                    message.style.color =
                        "red";


                    updateBtn.disabled =
                        false;

                    updateBtn.innerHTML =
                        '<i class="fa-solid fa-pen"></i> Update Note';

                }

            }
        );


        // =========================
        // BACK BUTTON
        // =========================

        document
            .getElementById("backBtn")
            .addEventListener(
                "click",
                function () {

                    window.location.href =
                        "dashboard.html";

                }
            );


        // =========================
        // START
        // =========================

        if (noteId && token) {

            loadNote();

        }

    </script>

</body>

</html>
