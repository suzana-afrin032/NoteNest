<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - NoteNest</title>

    <link rel="stylesheet" href="reset-password.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <div class="reset-container">

        <div class="reset-card">

            <!-- LOGO -->

            <div class="logo">
                Note<span>Nest</span>
            </div>


            <!-- CONTENT -->

            <div class="content">

                <div class="icon">
                    🔑
                </div>

                <h1>Reset Password</h1>

                <p>
                    Create a new password for your
                    NoteNest account.
                </p>


                <!-- FORM -->

                <form id="resetForm">

                    <!-- NEW PASSWORD -->

                    <div class="input-group">

                        <label for="password">
                            New Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter new password"
                            minlength="6"
                            required
                        >

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            minlength="6"
                            required
                        >

                    </div>


                    <!-- MESSAGE -->

                    <p
                        id="message"
                        class="message"
                    ></p>


                    <!-- BUTTON -->

                    <button
                        type="submit"
                        id="resetBtn"
                    >
                        Reset Password
                    </button>

                </form>


                <!-- BACK TO LOGIN -->

                <a
                    href="login.html"
                    class="back-login"
                >
                    ← Back to Login
                </a>

            </div>

        </div>

    </div>


    <script src="reset-password.js"></script>

</body>

</html>
